services:
  postgres:
    image: postgres:16-alpine
    container_name: gogate-postgres
    environment:
      POSTGRES_USER: gogate
      POSTGRES_PASSWORD: gogate_secret
      POSTGRES_DB: gogate_products
    ports:
      - "5432:5432"
    volumes:
      - gogate_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gogate-redis
    ports:
      - "6379:6379"

volumes:
  gogate_pg_data:
